# OPD 蒸馏 - 适配 12G 显存 (4070 Ti)
# 需要同时加载 student + 2 teachers，12G必须4-bit

student_model: "outputs/rft/final"
teacher_models:
  - "outputs/rl_box/final"
  - "outputs/rl_point/final"
teacher_weights:
  - 0.5
  - 0.5

freeze_vision_tower: true
freeze_llm: false
torch_dtype: "bfloat16"

load_in_4bit: true
load_in_8bit: false

datasets:
  - path: "data/sft/counting/counting_data.jsonl"
    image_root: "data/coco/val"
    task_type: "counting"
    weight: 1.0
  - path: "data/sft/spatial/spatial_data.jsonl"
    image_root: "data/sft/spatial"
    task_type: "spatial"
    weight: 1.0
  - path: "data/sft/maze/maze_data.jsonl"
    image_root: "data/sft/maze"
    task_type: "maze"
    weight: 1.0
  - path: "data/sft/path/path_data.jsonl"
    image_root: "data/sft/path"
    task_type: "path"
    weight: 1.0

batch_size: 1
gradient_accumulation_steps: 16
epochs: 2
learning_rate: 5.0e-7
ce_coeff: 0.1
weight_decay: 0.01
warmup_ratio: 0.03
max_length: 1024
image_size: 336
num_workers: 0
save_every: 1
device: "cuda"
