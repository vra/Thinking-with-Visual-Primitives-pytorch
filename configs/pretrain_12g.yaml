# 预训练配置 - 适配 12G 显存 (4070 Ti)
# 4-bit量化 + bf16 + LoRA(r=64)

model_name_or_path: "Qwen/Qwen2.5-VL-7B-Instruct"
use_spatial_compression: false
freeze_vision_tower: true
freeze_llm: false
use_lora: true
lora_r: 16
lora_alpha: 32
lora_target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"
lora_dropout: 0.05
torch_dtype: "bfloat16"

# 12G必须开启4bit
load_in_4bit: true
load_in_8bit: false

dataset_type: "jsonl"
data_path: "data/pretrain/grounding.jsonl"
image_root: "data/coco/val"

batch_size: 1
gradient_accumulation_steps: 16
epochs: 3
learning_rate: 5.0e-5
weight_decay: 0.01
warmup_ratio: 0.15
max_grad_norm: 0.5
max_length: 512
image_size: 224
num_workers: 0

save_every: 1
device: "cuda"
